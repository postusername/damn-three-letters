    <style>
      :root { color-scheme: light; --ink: #15213a; --muted: #66718a; --line: #dbe3f0; --blue: #2558d8; --sky: #eaf1ff; --mint: #dbf6ed; --mint-ink: #19745c; --paper: #ffffff; --canvas: #f4f7fb; }
      * { box-sizing: border-box; }
      html { min-height: 100%; background: var(--canvas); }
      body { min-width: 320px; min-height: 100vh; margin: 0; color: var(--ink); background: radial-gradient(circle at 9% 12%, #dff2ff 0, rgba(223,242,255,0) 26rem), radial-gradient(circle at 96% 78%, #e6e4ff 0, rgba(230,228,255,0) 30rem), var(--canvas); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      button { font: inherit; }
      .shell { width: min(100% - 32px, 720px); margin: 0 auto; padding: max(22px, env(safe-area-inset-top)) 0 max(30px, env(safe-area-inset-bottom)); }
      header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: clamp(34px, 8vh, 78px); }
      .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -.04em; font-size: 1.08rem; }
      .brand-mark { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 11px; color: #fff; background: var(--blue); box-shadow: 0 7px 16px rgba(37,88,216,.22); font-size: .95rem; letter-spacing: 0; }
      .count { padding: 8px 11px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); background: rgba(255,255,255,.7); font-size: .77rem; font-weight: 700; white-space: nowrap; }
      main { text-align: center; }
      .eyebrow { margin: 0 0 10px; color: var(--blue); font-size: .78rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
      h1 { max-width: 590px; margin: 0 auto; font-size: clamp(2.35rem, 8.5vw, 4.4rem); line-height: .98; letter-spacing: -.075em; }
      .intro { max-width: 420px; margin: 19px auto 31px; color: var(--muted); font-size: clamp(1rem, 2.9vw, 1.12rem); line-height: 1.48; }
      .mode-switch { display: inline-flex; gap: 3px; margin: 0 auto 15px; padding: 4px; border: 1px solid var(--line); border-radius: 14px; background: rgba(255,255,255,.78); box-shadow: 0 5px 16px rgba(47,74,122,.05); }
      .mode { min-height: 35px; padding: 0 13px; border: 0; border-radius: 10px; color: var(--muted); background: transparent; cursor: pointer; font-size: .82rem; font-weight: 800; transition: color .18s ease, background .18s ease, box-shadow .18s ease; }
      .mode:hover { color: var(--ink); background: #f3f6fc; }
      .mode.is-active { color: #173573; background: #fff; box-shadow: 0 2px 7px rgba(31,59,109,.13); }
      .mode:focus-visible { outline: 3px solid #9cbcff; outline-offset: 2px; }
      .machine { position: relative; max-width: 546px; margin: 0 auto; padding: 15px; border: 1px solid rgba(255,255,255,.95); border-radius: 28px; background: rgba(255,255,255,.65); box-shadow: 0 24px 60px rgba(35,66,118,.12), inset 0 1px 0 rgba(255,255,255,.9); backdrop-filter: blur(12px); }
      .machine::before, .machine::after { content: ""; position: absolute; top: 50%; width: 18px; height: 58px; border: 1px solid var(--line); background: linear-gradient(180deg,#fff,#e7edf7); transform: translateY(-50%); }
      .machine::before { left: -11px; border-radius: 11px 0 0 11px; }
      .machine::after { right: -11px; border-radius: 0 11px 11px 0; }
      .reels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; position: relative; }
      .reels::before, .reels::after { content: ""; position: absolute; left: 3px; right: 3px; z-index: 2; height: 1px; background: rgba(21,33,58,.09); pointer-events: none; }
      .reels::before { top: 16px; } .reels::after { bottom: 16px; }
      .reel { display: grid; place-items: center; min-height: clamp(122px, 30vw, 164px); overflow: hidden; border: 1px solid #d5deed; border-radius: 17px; color: #173573; background: linear-gradient(180deg, #eef4ff 0%, #fff 48%, #eaf1fc 100%); box-shadow: inset 0 1px 5px rgba(33,62,117,.06); }
      .letter { display: block; font-size: clamp(4.1rem, 17vw, 6.15rem); line-height: 1; font-weight: 900; letter-spacing: -.09em; text-shadow: 0 2px 0 #fff; }
      .reel.spinning .letter { animation: blur-roll .11s linear infinite; }
      @keyframes blur-roll { 0% { transform: translateY(-16px); filter: blur(1.8px); opacity: .45; } 100% { transform: translateY(16px); filter: blur(1.8px); opacity: .65; } }
      .action { width: 100%; margin-top: 14px; min-height: 58px; border: 0; border-radius: 16px; color: white; background: var(--blue); box-shadow: 0 12px 24px rgba(37,88,216,.24), inset 0 1px 0 rgba(255,255,255,.22); cursor: pointer; font-weight: 800; letter-spacing: .015em; transition: transform .18s ease, box-shadow .18s ease, background .18s ease; }
      .action:hover { background: #1d4ec9; box-shadow: 0 15px 28px rgba(37,88,216,.3); transform: translateY(-2px); }
      .action:active { transform: translateY(1px); box-shadow: 0 6px 12px rgba(37,88,216,.24); }
      .action:focus-visible { outline: 3px solid #9cbcff; outline-offset: 3px; }
      .action[disabled] { cursor: wait; opacity: .78; transform: none; }
      .lever { display: none; position: absolute; z-index: 4; top: 37px; right: -66px; width: 70px; height: 167px; padding: 0; border: 0; background: transparent; cursor: grab; touch-action: none; }
      .lever:active { cursor: grabbing; }
      .lever::before { content: ""; position: absolute; right: 21px; bottom: 0; width: 27px; height: 46px; border: 1px solid #bfcbe0; border-radius: 9px 9px 12px 12px; background: linear-gradient(90deg, #e7edf7, #fff 48%, #d6dfed); box-shadow: 0 7px 13px rgba(39,65,112,.16); }
      .lever-stem { position: absolute; z-index: 1; right: 30px; bottom: 33px; width: 10px; height: 103px; border: 1px solid #9dacbf; border-radius: 999px; background: linear-gradient(90deg,#bcc8d8,#fff 48%,#8999b1); transform-origin: bottom center; transition: transform .2s cubic-bezier(.2,.75,.25,1); }
      .lever-knob { position: absolute; z-index: 2; top: 3px; right: 18px; width: 34px; height: 34px; border: 2px solid #2e66df; border-radius: 50%; background: radial-gradient(circle at 35% 28%, #bfe2ff 0 7%, #4f90f2 30%, #2558d8 72%); box-shadow: 0 6px 13px rgba(37,88,216,.3); transform-origin: 17px 132px; transition: transform .2s cubic-bezier(.2,.75,.25,1); }
      .lever.is-pulling .lever-stem { transform: rotate(-27deg); }
      .lever.is-pulling .lever-knob { transform: rotate(-27deg); }
      .lever:focus-visible { outline: 3px solid #9cbcff; outline-offset: 3px; border-radius: 18px; }
      .hint { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 16px 0 0; color: var(--muted); font-size: .89rem; line-height: 1.35; }
      .hint-icon { display: inline-grid; place-items: center; flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%; color: #3864cf; background: var(--sky); font-size: .86rem; }
      .results { max-width: 546px; min-height: 147px; margin: 27px auto 0; padding: 20px 22px; border: 1px solid var(--line); border-radius: 21px; text-align: left; background: rgba(255,255,255,.78); box-shadow: 0 10px 32px rgba(47,74,122,.06); }
      .results-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 13px; }
      .results-title { margin: 0; color: var(--muted); font-size: .78rem; font-weight: 800; letter-spacing: .105em; text-transform: uppercase; }
      .code-chip { padding: 5px 8px; border-radius: 7px; color: var(--mint-ink); background: var(--mint); font-size: .78rem; font-weight: 900; letter-spacing: .08em; }
      .meaning { display: grid; gap: 10px; }
      .meaning-item { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: baseline; font-size: 1rem; line-height: 1.35; }
      .meaning-item::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #83a9ff; }
      .empty { padding: 7px 0 3px; color: var(--muted); font-size: 1rem; line-height: 1.45; }
      .footer { margin: 25px auto 0; color: #8792a7; font-size: .76rem; line-height: 1.45; }
      .footer a { color: inherit; text-decoration-color: #b8c5db; text-underline-offset: 2px; }
      .footer a:hover { color: var(--blue); }
      .live { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
      @media (min-width: 620px) { .lever { display: block; } .action { display: none; } }
      @media (max-width: 410px) { .shell { width: min(100% - 24px, 720px); } header { margin-bottom: 33px; } .mode { padding: 0 11px; } .machine { padding: 11px; border-radius: 23px; } .reels { gap: 6px; } .reel { min-height: 115px; border-radius: 14px; } .results { padding: 18px; } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <div class="brand"><span class="brand-mark">3Б</span><span>Три буквы</span></div>
        <span class="count" id="dictionary-count">словарь аббревиатур</span>
      </header>
      <main>
        <p class="eyebrow">рулетка из букв, но полезная</p>
        <h1>Поймай три<br />важные буквы</h1>
        <p class="intro">Встряхните телефон — и автомат переведёт очередное сокращение с офисного на человеческий.</p>
        <div class="mode-switch" role="group" aria-label="Режим выпадения аббревиатур">
          <button class="mode is-active" type="button" data-mode="auto" aria-pressed="true">Авто</button>
          <button class="mode" type="button" data-mode="ru" aria-pressed="false">Кириллица</button>
          <button class="mode" type="button" data-mode="en" aria-pressed="false">Латиница</button>
        </div>
        <section class="machine" aria-label="Автомат с буквенными барабанами">
          <div class="reels" aria-live="off">
            <div class="reel"><span class="letter" id="letter-0">Д</span></div>
            <div class="reel"><span class="letter" id="letter-1">Э</span></div>
            <div class="reel"><span class="letter" id="letter-2">Г</span></div>
          </div>
          <button class="lever" id="lever" type="button" aria-label="Потянуть ручку автомата"><span class="lever-stem"></span><span class="lever-knob"></span></button>
          <button class="action" id="spin-button" type="button">КРУТИТЬ БУКВЫ</button>
        </section>
        <p class="hint" id="hint"><span class="hint-icon">⌁</span><span>На телефоне можно просто встряхнуть</span></p>
        <section class="results" aria-labelledby="results-title">
          <div class="results-head"><h2 class="results-title" id="results-title">Нашлось в словаре</h2><span class="code-chip" id="code-chip">ДЭГ</span></div>
          <div class="meaning" id="meaning"></div>
        </section>
        <p class="footer">Реальные сокращения из <a href="https://www.nasa.gov/wp-content/uploads/2015/04/nnk14ma75c-attachment-j-05-glossary-and-acronym-list.pdf">NASA</a>, <a href="https://ilrs.gsfc.nasa.gov/about/acronyms.html">NASA ILRS</a> и <a href="https://www.iana.org/assignments/service-names-port-numbers">IANA</a>.</p>
        <p class="live" id="live" aria-live="polite"></p>
      </main>
    </div>

        function renderResults(code, language) {
          const dictionary = DICTIONARIES[language];
          chip.textContent = code;
          resultsTitle.textContent = `${dictionary.name} · расшифровка`;
          const definitions = dictionary.entries[code] || [];
          meaning.replaceChildren();
          if (!definitions.length) {

            empty.className = 'empty';

            return;

            item.className = 'meaning-item';
            const label = document.createElement('span');
            label.textContent = text;
            item.append(label);
            meaning.append(item);
          });
        }

        function randomLetter(language) {
          const alphabet = ALPHABETS[language];
          return alphabet[Math.floor(Math.random() * alphabet.length)];
        }

        function pickLanguage() {
          return selectedMode === 'auto' ? (Math.random() < .5 ? 'ru' : 'en') : selectedMode;
        }

        function pickCode(language) {
          const codes = codesByLanguage[language];
          let next = codes[Math.floor(Math.random() * codes.length)];
          const current = letters.map(letter => letter.textContent).join('');
          if (codes.length > 1) while (next === current) next = codes[Math.floor(Math.random() * codes.length)];
          return next;
        }

        function updateHint() {
          const isDesktop = window.matchMedia('(min-width: 620px)').matches;
          if (isDesktop) {
            hint.lastElementChild.textContent = 'Потяните ручку автомата — она всё решит.';
          } else if (typeof DeviceMotionEvent === 'undefined') {
            hint.lastElementChild.textContent = 'Встряска недоступна — крутите кнопкой.';
          } else {
            hint.lastElementChild.textContent = 'На телефоне можно просто встряхнуть';
          }
        }

        function setMode(mode) {
          selectedMode = mode;
          modeButtons.forEach(modeButton => {
            const active = modeButton.dataset.mode === mode;
            modeButton.classList.toggle('is-active', active);
            modeButton.setAttribute('aria-pressed', String(active));
          });
          const modeName = mode === 'auto' ? 'авто: каждый раз случайный алфавит' : `режим «${DICTIONARIES[mode].name}»`;
          live.textContent = `Выбран ${modeName}.`;
        }

        function spin(source = 'button') {
          if (spinning) return;
          spinning = true;
          button.disabled = true;
          lever.disabled = true;
          button.textContent = 'КРУТИМ…';
          const language = pickLanguage();
          const code = pickCode(language);
          const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          const intervals = reels.map((reel, index) => {
            reel.classList.add('spinning');
            return window.setInterval(() => { letters[index].textContent = randomLetter(language); }, reduced ? 0 : 68);
          });
          reels.forEach((reel, index) => {
            window.setTimeout(() => {
              window.clearInterval(intervals[index]);
              reel.classList.remove('spinning');
              letters[index].textContent = code[index];
              if (index === reels.length - 1) {
                renderResults(code, language);
                live.textContent = `${code}: ${DICTIONARIES[language].entries[code].join('. ')}`;
                button.disabled = false;
                lever.disabled = false;
                button.textContent = 'КРУТИТЬ ЕЩЁ';
                spinning = false;
              }
            }, reduced ? 20 : 520 + index * 230);
          });
          if (source === 'shake') hint.lastElementChild.textContent = 'Встряска принята. Ещё раз — ещё три буквы.';
          if (source === 'lever') hint.lastElementChild.textContent = 'Ручка потянута. Ставки сделаны.';
        }

        async function enableMotionAndSpin() {
          if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
            try {
              const permission = await DeviceMotionEvent.requestPermission();
              if (permission !== 'granted') {
                hint.lastElementChild.textContent = 'Нет доступа к датчику — кнопка всё равно работает.';
                return spin();
              }
              hint.lastElementChild.textContent = 'Датчик включён — встряхивайте сколько угодно.';
            } catch (_) {
              hint.lastElementChild.textContent = 'Датчик недоступен — крутите кнопкой.';
            }
          }
          spin();
        }

        function listenForShake(event) {
          const acceleration = event.accelerationIncludingGravity || event.acceleration;
          if (!acceleration) return;
          const force = Math.abs(acceleration.x || 0) + Math.abs(acceleration.y || 0) + Math.abs(acceleration.z || 0);
          const now = Date.now();
          if (force > 28 && now - lastShake > 1250) { lastShake = now; spin('shake'); }
        }

        button.addEventListener('click', enableMotionAndSpin);
        modeButtons.forEach(modeButton => modeButton.addEventListener('click', () => setMode(modeButton.dataset.mode)));
        lever.addEventListener('pointerdown', event => {
          lever.classList.add('is-pulling');
          lever.setPointerCapture?.(event.pointerId);
        });
        lever.addEventListener('pointerup', () => {
          lever.classList.remove('is-pulling');
          leverTriggeredAt = Date.now();
          spin('lever');
        });
        lever.addEventListener('pointercancel', () => lever.classList.remove('is-pulling'));
        lever.addEventListener('click', () => {
          if (Date.now() - leverTriggeredAt > 450) spin('lever');
        });
        window.addEventListener('devicemotion', listenForShake, { passive: true });
        window.addEventListener('resize', updateHint, { passive: true });
        updateHint();
        renderResults('ДЭГ', 'ru');
      })();
    </script>
  </body>
</html>
